[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-fix"
version = "1.0.0"
description = "Fix grammar with a keyboard shortcut using a local LLM (Ollama)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Carlos Rodrigo", email = "hi@carlosrodrigo.me"}
]
keywords = ["grammar", "llm", "ollama", "keyboard", "shortcut"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
macos = [
    "rumps>=0.4.0",
    "pyobjc-framework-Quartz>=9.0",
    "pyobjc-framework-Cocoa>=9.0",
]
linux = [
    "pystray>=0.19.0",
    "pynput>=1.7.0",
    "pyperclip>=1.8.0",
    "Pillow>=9.0.0",
]
dev = [
    "pyinstaller>=5.0",
    "pytest>=7.0",
]

[project.scripts]
grammar-fix = "grammar_fix.__main__:main"

[project.urls]
Homepage = "https://github.com/carlos-rodrigo/ai-grammar-keyboard"
Repository = "https://github.com/carlos-rodrigo/ai-grammar-keyboard"

[tool.setuptools.packages.find]
where = ["src"]
